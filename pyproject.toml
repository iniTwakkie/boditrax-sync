[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boditrax-sync"
version = "0.1.0"
description = "Unofficial, reverse-engineered CLI to export Boditrax 2.0 body-composition scans to JSON/CSV and sync them to PostgreSQL or SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Danie Nell" }]
keywords = [
    "boditrax",
    "body-composition",
    "health",
    "export",
    "cli",
    "postgresql",
    "sqlite",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
boditrax-sync = "boditrax_sync.cli:main"

[project.urls]
Homepage = "https://github.com/iniTwakkie/boditrax-sync"
Issues = "https://github.com/iniTwakkie/boditrax-sync/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/boditrax_sync"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
